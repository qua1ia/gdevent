<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>广东省户外赛事日历 2026</title>
<!-- 数据文件：网页和移动版共用 -->
<script src="data/events-data.js"></script>
<style>
:root {
  --triathlon: #e74c3c; --openwater: #3498db; --trailrun: #27ae60;
  --familyrun: #e67e22; --marathon: #9b59b6; --cycling: #1abc9c;
  --roadrun: #f39c12; --orient: #ec4899;
  --bg: #0f172a; --card: #1e293b; --border: #334155;
  --text: #e2e8f0; --text2: #94a3b8; --today: #f59e0b;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

/* ===== 顶部工具条（标题 + 月份导航 + 更新，单行） ===== */
.topbar { display:flex; align-items:center; gap:10px; padding:9px 18px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
.topbar h1 { font-size:16px; font-weight:700; white-space:nowrap; }
.topbar .stats { font-size:12px; color:var(--text2); white-space:nowrap; }
.topbar .nav { margin-left:auto; display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
.btn { background:var(--card); border:1px solid var(--border); color:var(--text); padding:4px 9px; border-radius:6px; cursor:pointer; font-size:12px; line-height:1.4; transition:background .15s; }
.btn:hover { background:#334155; }
.btn:disabled { opacity:.45; cursor:default; }
.btn.primary { background:#3b82f6; border-color:#3b82f6; color:#fff; }
.btn.primary:hover { background:#2563eb; }
.month-label { font-size:13px; font-weight:600; min-width:92px; text-align:center; }
.btn.out-btn { color:#7dd3fc; border-color:#1e4c63; }
.btn.out-btn.off { opacity:.45; text-decoration:line-through; color:var(--text2); }
.seg { display:flex; border:1px solid var(--border); border-radius:6px; overflow:hidden; }
.seg button { background:transparent; border:none; color:var(--text2); font-size:12px; padding:4px 10px; cursor:pointer; transition:background .15s; }
.seg button.active { background:#3b82f6; color:#fff; font-weight:600; }
.status { font-size:11px; color:var(--text2); }

/* ===== 筛选（类型 / 城市 各一行，横向滚动） ===== */
.filters { border-bottom:1px solid var(--border); }
.frow { display:flex; align-items:center; gap:8px; padding:3px 18px; }
.frow + .frow { border-top:1px solid rgba(51,65,85,.5); }
.flabel { flex:0 0 28px; font-size:11px; color:var(--text2); font-weight:600; }
.chips { display:flex; gap:4px; overflow-x:auto; padding:3px 0; scrollbar-width:thin; }
.chips::-webkit-scrollbar { height:5px; }
.chips::-webkit-scrollbar-thumb { background:#334155; border-radius:3px; }
.filter-item { flex:0 0 auto; display:flex; align-items:center; gap:4px; font-size:11px; color:var(--text2); padding:2px 7px; border-radius:9px; border:1px solid transparent; cursor:pointer; white-space:nowrap; transition:all .15s; }
.filter-item:hover { background:var(--card); }
.filter-item.disabled { opacity:.35; text-decoration:line-through; }
.filter-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }

/* ===== 日历（周一~周五压缩、周六日加宽） ===== */
.cal-head, .cal-grid { display:grid; grid-template-columns:repeat(5, .62fr) 1.19fr 1.19fr; gap:1px; }
.cal-head { padding:6px 18px 0; }
.cal-head div { text-align:center; font-size:11px; color:var(--text2); padding:2px 0; }
.cal-head div.wk { color:#7dd3fc; font-weight:700; }
.cal-grid { padding:1px 18px 14px; }
.cal-cell { background:var(--card); min-height:72px; padding:3px; border-radius:4px; position:relative; font-size:12px; cursor:pointer; transition:background .15s; }
.cal-cell.wkday { background:#1b2537; }
.cal-cell.wkend { background:#22304d; }
.cal-cell:hover { background:#334155; }
.cal-cell.other-month { opacity:.3; }
.cal-cell.today { box-shadow:inset 0 0 0 2px var(--today); }
.day-num { font-weight:700; font-size:11px; margin-bottom:1px; color:var(--text2); }
.cal-cell.today .day-num { color:var(--today); }
.event-chip { font-size:10px; padding:1px 4px; border-radius:3px; margin-bottom:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; transition:opacity .15s; }
.event-chip:hover { opacity:.8; }
.chip-triathlon { background:rgba(231,76,60,.2); color:#e74c3c; }
.chip-openwater { background:rgba(52,152,219,.2); color:#3498db; }
.chip-trailrun { background:rgba(39,174,96,.2); color:#27ae60; }
.chip-familyrun { background:rgba(230,126,34,.2); color:#e67e22; }
.chip-marathon { background:rgba(155,89,182,.2); color:#9b59b6; }
.chip-cycling { background:rgba(26,188,156,.2); color:#1abc9c; }
.chip-roadrun { background:rgba(243,156,18,.2); color:#f39c12; }
.chip-orient { background:rgba(236,72,153,.2); color:#ec4899; }
.more-chip { font-size:10px; color:var(--text2); padding:0 4px; cursor:pointer; }
.more-chip:hover { color:var(--today); }

/* ===== 关注 / 不关注 ===== */
.event-chip.f-follow { box-shadow:inset 0 0 0 1.5px #fbbf24; font-weight:700; }
.event-chip.f-ignore { font-size:9px; padding:0 3px; opacity:.4; max-width:55%; }
.list-item.f-follow { border-left:3px solid #fbbf24; }
.list-item.f-ignore { padding:4px 10px; opacity:.55; }
.list-item.f-ignore h3 { font-size:12px; font-weight:400; }
.list-item.f-ignore .list-info p,
.list-item.f-ignore .list-badge,
.list-item.f-ignore .list-deadline { display:none; }
.ftag { font-size:10px; color:var(--text2); }
.fbar { display:flex; gap:6px; margin-top:9px; }
.fbar button { flex:1; background:var(--card); border:1px solid var(--border); color:var(--text); font-size:12px; padding:5px 0; border-radius:6px; cursor:pointer; transition:all .15s; }
.fbar button:hover { background:#334155; }
.fbar button.on { background:#fbbf24; border-color:#fbbf24; color:#1e293b; font-weight:700; }
.fbar button.btn-ignore.on { background:#64748b; border-color:#64748b; color:#fff; }

/* ===== 列表 ===== */
.list-view { padding:10px 18px 20px; display:none; }
.list-month { font-size:13px; font-weight:700; color:var(--text2); border-bottom:1px solid var(--border); padding:8px 0 5px; margin-top:4px; }
.list-item { display:flex; gap:10px; padding:8px 10px; background:var(--card); border-radius:7px; margin-bottom:6px; cursor:pointer; transition:background .15s; }
.list-item:hover { background:#334155; }
.list-date { text-align:center; min-width:40px; }
.list-date .month { font-size:10px; color:var(--text2); }
.list-date .day { font-size:17px; font-weight:700; }
.list-info { flex:1; min-width:0; }
.list-info h3 { font-size:13px; font-weight:600; margin-bottom:2px; }
.list-info p { font-size:12px; color:var(--text2); margin-bottom:1px; }
.list-badge { display:inline-block; font-size:10px; padding:1px 6px; border-radius:3px; margin-top:1px; }
.list-city { font-size:11px; color:var(--text2); margin-left:6px; }
.list-deadline { font-size:11px; margin-top:3px; }
.list-deadline.urgent { color:#ef4444; font-weight:600; }
.list-deadline.soon { color:#f59e0b; }
.empty { text-align:center; padding:30px; color:var(--text2); font-size:13px; }

/* ===== 提示框 ===== */
.tooltip { position:fixed; background:#1e293b; border:1px solid var(--border); border-radius:8px; padding:12px; min-width:260px; max-width:340px; box-shadow:0 8px 30px rgba(0,0,0,.4); z-index:9999; display:none; }
.tooltip.show { display:block; }
.tooltip-close { position:absolute; right:8px; top:8px; background:none; border:none; color:var(--text2); font-size:16px; cursor:pointer; }
.tooltip-title { font-size:14px; font-weight:700; margin-bottom:8px; padding-right:20px; line-height:1.4; }
.tooltip-row { font-size:12px; color:var(--text2); margin-bottom:4px; }
.tooltip-row .label { color:var(--text); font-weight:600; margin-right:6px; }
.tooltip-link { display:block; margin-top:8px; padding:6px 0; text-align:center; background:#3b82f6; color:#fff; border-radius:6px; text-decoration:none; font-size:13px; font-weight:600; }
.tooltip-link:hover { background:#2563eb; }

@media(max-width:640px) {
  .topbar { padding:8px 12px; }
  .topbar h1 { font-size:14px; }
  .topbar .stats { display:none; }
  .frow { padding:3px 12px; }
  .cal-head { padding:4px 6px 0; }
  .cal-grid { padding:1px 6px 12px; }
  .cal-cell { min-height:58px; }
  .cal-cell.wkday { min-height:48px; }
  .list-view { padding:10px 12px; }
}
</style>
</head>
<body>

<div class="topbar">
  <h1>🏃 广东省户外赛事日历</h1>
  <span class="stats" id="statsLine">加载中...</span>
  <div class="nav">
    <button class="btn" id="prevBtn" onclick="changeMonth(-1)">‹</button>
    <div class="month-label" id="monthLabel">—</div>
    <button class="btn" id="nextBtn" onclick="changeMonth(1)">›</button>
    <button class="btn" onclick="goToday()">今天</button>
    <button class="btn out-btn" id="outBtn" onclick="toggleOut()" title="一键显示/隐藏省外赛事">🌏 省外</button>
    <div class="seg">
      <button class="active" id="calViewBtn" onclick="switchView('cal')">日历</button>
      <button id="listViewBtn" onclick="switchView('list')">列表</button>
    </div>
    <button class="btn primary" id="updateBtn" onclick="fetchLatestData()">🔄 更新</button>
    <span class="status" id="updateStatus"></span>
  </div>
</div>

<div class="filters">
  <div class="frow">
    <span class="flabel">类型</span>
    <div class="chips" id="typeFilter"></div>
  </div>
  <div class="frow">
    <span class="flabel">城市</span>
    <div class="chips" id="cityFilter"></div>
  </div>
</div>

<div class="cal-head">
  <div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div class="wk">六</div><div class="wk">日</div>
</div>
<div class="cal-grid" id="calGrid"></div>
<div class="list-view" id="listView"></div>

<div class="tooltip" id="tooltip">
  <button class="tooltip-close" onclick="hideTooltip()">✕</button>
  <div id="tooltipContent"></div>
</div>

<script>
/* ====== 状态 ====== */
let currentYear, currentMonth;
let hiddenTypes = new Set();
let hiddenCities = new Set();
const today = new Date();
currentYear = today.getFullYear();
currentMonth = today.getMonth();

const OUT_CITIES = window.OUT_PROVINCE_CITIES || [];
const OUT_SET = new Set(OUT_CITIES);

/* ===== 关注 / 不关注（localStorage 持久化，与移动版共享） ===== */
let FOLLOWS = {};
try { FOLLOWS = JSON.parse(localStorage.getItem('gdevent.follows') || '{}') || {}; } catch (e) { FOLLOWS = {}; }
function saveFollows() { try { localStorage.setItem('gdevent.follows', JSON.stringify(FOLLOWS)); } catch (e) {} }
function followState(id) { return FOLLOWS[id] || ''; }
function followRank(id) { const s = followState(id); return s === 'follow' ? 0 : s === 'ignore' ? 2 : 1; }
function setFollow(id, st) {
  if (st) FOLLOWS[id] = st; else delete FOLLOWS[id];
  saveFollows();
  refresh();
  updateStats();
  // 同步气泡内按钮态
  const tip = document.getElementById('tooltip');
  if (tip.classList.contains('show')) {
    const b1 = tip.querySelector('[data-act="follow"]'), b2 = tip.querySelector('[data-act="ignore"]');
    if (b1) b1.classList.toggle('on', st === 'follow');
    if (b2) b2.classList.toggle('on', st === 'ignore');
  }
}
function followBarHtml(ev) {
  const st = followState(ev.id);
  return `<div class="fbar">` +
    `<button data-act="follow" class="${st === 'follow' ? 'on' : ''}" onclick="event.stopPropagation();setFollow(${ev.id},'follow')">⭐ 关注</button>` +
    `<button data-act="ignore" class="btn-ignore ${st === 'ignore' ? 'on' : ''}" onclick="event.stopPropagation();setFollow(${ev.id},'ignore')">🚫 不关注</button>` +
    `</div>`;
}
// 城市筛选项：广东各市 + 一个「省外」合并项
const CITY_KEYS = (window.CITY_LIST || []).filter(c => !OUT_SET.has(c)).concat(['省外']);
const OUT_KEY = '省外';

/* 本地时区的今天（YYYY-MM-DD），避免 toISOString 的时区偏移 */
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function isOutProvince(city) { return OUT_SET.has(city); }
function cityHidden(city) {
  return hiddenCities.has(city) || (hiddenCities.has(OUT_KEY) && isOutProvince(city));
}

/* ====== 初始化 ====== */
function init() {
  renderTypeFilter();
  renderCityFilter();
  updateOutBtn();
  renderCalendar();
  updateStats();
}

function updateStats() {
  const total = EVENTS.length;
  const upcoming = EVENTS.filter(e => e.date >= todayStr()).length;
  const out = EVENTS.filter(e => isOutProvince(e.city)).length;
  const f = EVENTS.filter(e => followState(e.id) === 'follow').length;
  const g = EVENTS.filter(e => followState(e.id) === 'ignore').length;
  document.getElementById('statsLine').textContent =
    `共 ${total} 场 · 广东 ${total - out} · 省外 ${out} · 即将进行 ${upcoming}` +
    (f || g ? ` · ⭐关注 ${f} · 🚫忽略 ${g}` : '');
}

/* ====== 筛选 ====== */
function renderTypeFilter() {
  const el = document.getElementById('typeFilter');
  el.innerHTML = '';
  for (const [type, info] of Object.entries(TYPE_MAP)) {
    const count = EVENTS.filter(e => e.type === type).length;
    const item = document.createElement('div');
    item.className = 'filter-item' + (hiddenTypes.has(type) ? ' disabled' : '');
    item.innerHTML = `<span class="filter-dot" style="background:${info.color}"></span>${info.label}<span style="opacity:.5">${count}</span>`;
    item.onclick = () => {
      hiddenTypes.has(type) ? hiddenTypes.delete(type) : hiddenTypes.add(type);
      refresh();
    };
    el.appendChild(item);
  }
}

function renderCityFilter() {
  const el = document.getElementById('cityFilter');
  el.innerHTML = '';
  const all = document.createElement('div');
  all.className = 'filter-item' + (hiddenCities.size === 0 ? '' : ' disabled');
  all.textContent = '全部';
  all.onclick = () => {
    if (hiddenCities.size > 0) hiddenCities.clear();
    else CITY_KEYS.forEach(c => hiddenCities.add(c));
    refresh();
  };
  el.appendChild(all);
  CITY_KEYS.forEach(city => {
    const count = EVENTS.filter(e => city === OUT_KEY ? isOutProvince(e.city) : e.city === city).length;
    if (!count) return;                       // 没有赛事的城市不出筛选项
    const item = document.createElement('div');
    item.className = 'filter-item' + (hiddenCities.has(city) ? ' disabled' : '');
    item.textContent = city + count;
    item.onclick = () => {
      hiddenCities.has(city) ? hiddenCities.delete(city) : hiddenCities.add(city);
      refresh();
    };
    el.appendChild(item);
  });
}

/* 「省外」快捷开关：与城市筛选里的「省外」项共用同一状态 */
function toggleOut() {
  hiddenCities.has(OUT_KEY) ? hiddenCities.delete(OUT_KEY) : hiddenCities.add(OUT_KEY);
  refresh();
}
function updateOutBtn() {
  const btn = document.getElementById('outBtn');
  if (!btn) return;
  const n = EVENTS.filter(e => isOutProvince(e.city)).length;
  const hidden = hiddenCities.has(OUT_KEY);
  btn.textContent = (hidden ? '🚫 省外已隐藏 ' : '🌏 省外 ') + n;
  btn.classList.toggle('off', hidden);
}

function refresh() {
  renderTypeFilter();
  renderCityFilter();
  updateOutBtn();
  renderCalendar();
  if (document.getElementById('listView').style.display === 'block') renderListView();
}

function filteredEvents() {
  return EVENTS.filter(e => !hiddenTypes.has(e.type) && !cityHidden(e.city));
}

/* ====== 视图切换 ====== */
function changeMonth(d) {
  currentMonth += d;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  renderCalendar();
}
function goToday() {
  currentYear = today.getFullYear();
  currentMonth = today.getMonth();
  renderCalendar();
  if (document.getElementById('listView').style.display === 'block') renderListView();
}
function switchView(v) {
  document.getElementById('calViewBtn').classList.toggle('active', v === 'cal');
  document.getElementById('listViewBtn').classList.toggle('active', v === 'list');
  document.getElementById('calGrid').style.display = v === 'cal' ? '' : 'none';
  document.getElementById('listView').style.display = v === 'list' ? 'block' : 'none';
  if (v === 'list') renderListView();
}

/* ====== 日历渲染 ====== */
function renderCalendar() {
  const months = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  document.getElementById('monthLabel').textContent = currentYear + '年' + months[currentMonth];
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  const t = todayStr();

  const firstDay = new Date(currentYear, currentMonth, 1);
  let startDay = firstDay.getDay(); if (startDay === 0) startDay = 7; startDay--;
  const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
  const daysInPrev = new Date(currentYear, currentMonth, 0).getDate();
  const visible = filteredEvents();

  for (let i = 0; i < 42; i++) {
    const cell = document.createElement('div');
    // 列序：0=周一 … 5=周六 6=周日（周末列加宽、多显示赛事）
    const col = i % 7;
    const isWkend = col >= 5;
    cell.className = 'cal-cell ' + (isWkend ? 'wkend' : 'wkday');
    let dayNum, dateStr, isOther = false;

    if (i < startDay) {
      dayNum = daysInPrev - startDay + i + 1;
      const pm = currentMonth === 0 ? 11 : currentMonth - 1;
      const py = currentMonth === 0 ? currentYear - 1 : currentYear;
      dateStr = py + '-' + String(pm + 1).padStart(2, '0') + '-' + String(dayNum).padStart(2, '0');
      isOther = true;
    } else if (i - startDay >= daysInMonth) {
      dayNum = i - startDay - daysInMonth + 1;
      const nm = currentMonth === 11 ? 0 : currentMonth + 1;
      const ny = currentMonth === 11 ? currentYear + 1 : currentYear;
      dateStr = ny + '-' + String(nm + 1).padStart(2, '0') + '-' + String(dayNum).padStart(2, '0');
      isOther = true;
    } else {
      dayNum = i - startDay + 1;
      dateStr = currentYear + '-' + String(currentMonth + 1).padStart(2, '0') + '-' + String(dayNum).padStart(2, '0');
    }

    if (isOther) cell.classList.add('other-month');
    if (dateStr === t) cell.classList.add('today');

    const dayEl = document.createElement('div');
    dayEl.className = 'day-num';
    dayEl.textContent = dayNum;
    cell.appendChild(dayEl);

    const dayEvents = visible.filter(e => e.date === dateStr)
      .sort((a, b) => followRank(a.id) - followRank(b.id));   // 关注在前，忽略在后
    const maxShow = isWkend ? 5 : 2;   // 周末列更宽，多显示几场
    dayEvents.slice(0, maxShow).forEach(ev => {
      const chip = document.createElement('div');
      const cls = (TYPE_MAP[ev.type] || {}).cls || '';
      const st = followState(ev.id);
      chip.className = 'event-chip chip-' + cls +
        (st === 'follow' ? ' f-follow' : st === 'ignore' ? ' f-ignore' : '');
      chip.textContent = (st === 'follow' ? '⭐' : '') + (ev.city ? ev.city + '·' : '') + ev.name;
      chip.onclick = (e) => { e.stopPropagation(); showTooltip(ev, e); };
      cell.appendChild(chip);
    });
    if (dayEvents.length > maxShow) {
      const more = document.createElement('div');
      more.className = 'more-chip';
      more.textContent = '+' + (dayEvents.length - maxShow) + ' 更多';
      more.onclick = (e) => { e.stopPropagation(); showDayList(dateStr, dayEvents, e); };
      cell.appendChild(more);
    }

    grid.appendChild(cell);
  }
}

/* ====== 提示 ====== */
function showTooltip(ev, e) {
  const tip = document.getElementById('tooltip');
  const info = TYPE_MAP[ev.type] || {};
  let deadlineClass = ''; let deadlineText = ev.deadline || '';
  if (ev.deadline && ev.deadline !== '待公布' && ev.deadline !== '待确认' && ev.deadline !== '先报先得') {
    const dl = new Date(ev.deadline.replace(' ', 'T'));
    const diff = (dl - today) / 86400000;
    if (diff < 0) { deadlineClass = 'expired'; deadlineText += ' ⛔已截止'; }
    else if (diff < 3) { deadlineClass = 'urgent'; deadlineText += ' 🔴即将截止!'; }
    else if (diff < 7) { deadlineClass = 'soon'; deadlineText += ' 🟡'; }
  }
  let html = `<div class="tooltip-title"><span class="tooltip-type" style="background:${info.color || '#666'}20;color:${info.color || '#666'}">${info.label || ev.type}</span> ${ev.name}</div>`;
  if (ev.loc) html += `<div class="tooltip-row"><span class="label">📍 地点</span>${ev.loc}</div>`;
  html += `<div class="tooltip-row"><span class="label">🏙 城市</span>${ev.city}${isOutProvince(ev.city) ? '（省外）' : ''}</div>`;
  html += `<div class="tooltip-row"><span class="label">📅 时间</span>${ev.date}</div>`;
  if (ev.deadline) html += `<div class="tooltip-row tooltip-deadline ${deadlineClass}"><span class="label">⏰ 截止</span>${deadlineText}</div>`;
  if (ev.source) html += `<div class="tooltip-row"><span class="label">📡 来源</span>${ev.source}</div>`;
  if (ev.note) html += `<div class="tooltip-row"><span class="label">📝 备注</span>${ev.note}</div>`;
  if (ev.link) html += `<a class="tooltip-link" href="${ev.link}" target="_blank">🔗 前往报名 →</a>`;
  html += followBarHtml(ev);
  const st0 = followState(ev.id);
  if (st0) html += `<div class="ftag" style="margin-top:5px;text-align:center">${st0 === 'follow' ? '⭐ 已关注：始终完整展示' : '🚫 已忽略：日历/列表中缩小显示'}</div>`;
  document.getElementById('tooltipContent').innerHTML = html;
  tip.classList.add('show');
  const rect = (e && e.target) ? e.target.getBoundingClientRect() : { right:200, top:200 };
  let left = (rect.right || 200) + 8, top = (rect.top || 200);
  if (left + 330 > window.innerWidth) left = (rect.left || 200) - 330;
  if (top + 320 > window.innerHeight) top = window.innerHeight - 320;
  left = Math.max(8, Math.min(left, window.innerWidth - 330));
  top = Math.max(8, top);
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
}

function showDayList(dateStr, dayEvents, e) {
  const tip = document.getElementById('tooltip');
  let html = `<div style="font-weight:700;margin-bottom:8px">📅 ${dateStr} 共${dayEvents.length}场</div>`;
  dayEvents.forEach(ev => {
    const info = TYPE_MAP[ev.type] || {};
    html += `<div style="padding:5px 0;border-bottom:1px solid var(--border);cursor:pointer" onclick="hideTooltip();setTimeout(()=>showTooltip(EVENTS.find(x=>x.id===${ev.id}),event)">`;
    html += `<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${(info.color||'#666')};margin-right:5px"></span>`;
    html += `<span style="font-size:12px">${followState(ev.id) === 'follow' ? '⭐' : ''}${ev.city}·${ev.name}${followState(ev.id) === 'ignore' ? '（已忽略）' : ''}</span>`;
    html += `<div style="font-size:10px;color:var(--text2);margin-left:12px">${ev.loc||''}</div></div>`;
  });
  document.getElementById('tooltipContent').innerHTML = html;
  tip.classList.add('show');
  const rect = (e && e.target) ? e.target.getBoundingClientRect() : { right:200, top:200 };
  const l = Math.max(8, Math.min((rect.right||200)+8, window.innerWidth-330));
  const t = Math.max(8, Math.min((rect.top||200), window.innerHeight-300));
  tip.style.left = l + 'px';
  tip.style.top = t + 'px';
}

function hideTooltip() { document.getElementById('tooltip').classList.remove('show'); }
document.addEventListener('click', (e) => {
  if (!e.target.closest('.tooltip') && !e.target.closest('.event-chip') && !e.target.closest('.more-chip') && !e.target.closest('.list-item')) hideTooltip();
});

/* ====== 列表视图 ====== */
function renderListView() {
  const el = document.getElementById('listView');
  const visible = filteredEvents().filter(e => e.date >= todayStr());
  visible.sort((a, b) => a.date.localeCompare(b.date) || followRank(a.id) - followRank(b.id));
  if (visible.length === 0) {
    el.innerHTML = '<div class="empty">暂无符合条件的赛事</div>';
    return;
  }
  let html = '', lastMonth = '';
  visible.forEach(ev => {
    const m = ev.date.slice(0, 7);
    if (m !== lastMonth) {
      const [y, mo] = m.split('-');
      html += `<div class="list-month">${y}年${parseInt(mo)}月</div>`;
      lastMonth = m;
    }
    const st = followState(ev.id);
    const [dy, dm, dd] = ev.date.split('-');
    let dlCls = '';
    if (ev.deadline && ev.deadline !== '待公布' && ev.deadline !== '待确认' && ev.deadline !== '先报先得') {
      const dl = new Date(ev.deadline.replace(' ', 'T'));
      const diff = (dl - today) / 86400000;
      if (diff < 0) dlCls = '';
      else if (diff < 3) dlCls = 'urgent';
      else if (diff < 7) dlCls = 'soon';
    }
    const info = TYPE_MAP[ev.type] || {};
    const name = (st === 'follow' ? '⭐ ' : '') + ev.name +
      (st === 'ignore' ? ' <span class="ftag">🚫已忽略·点开可恢复</span>' : '');
    html += `<div class="list-item${st === 'follow' ? ' f-follow' : st === 'ignore' ? ' f-ignore' : ''}" onclick="showTooltip(EVENTS.find(x=>x.id===${ev.id}),event)">
      <div class="list-date"><div class="month">${parseInt(dm)}月</div><div class="day">${parseInt(dd)}</div></div>
      <div class="list-info"><h3>${name}</h3><p>📍 ${ev.loc||ev.city}</p>
        <span class="list-badge" style="background:${(info.color||'#666')}20;color:${info.color||'#666'}">${info.label||ev.type}</span>
        <span class="list-city">${ev.city}${isOutProvince(ev.city) ? '（省外）' : ''}</span>
        ${ev.deadline ? `<div class="list-deadline ${dlCls}">⏰ 报名截止：${ev.deadline}</div>` : ''}
      </div></div>`;
  });
  el.innerHTML = html;
}

/* ====== 更新数据 ====== */
const DATA_URL = 'data/events-data.js';

function fetchLatestData() {
  const btn = document.getElementById('updateBtn');
  const status = document.getElementById('updateStatus');
  btn.disabled = true;
  btn.textContent = '⏳ 更新中';
  status.textContent = '正在获取最新数据...';
  const url = DATA_URL + '?t=' + Date.now();
  const s = document.createElement('script');
  s.src = url;
  s.onload = () => {
    btn.disabled = false;
    btn.textContent = '✅ 已更新';
    status.textContent = new Date().toLocaleTimeString('zh-CN');
    refresh();
    updateStats();
    setTimeout(() => { btn.textContent = '🔄 更新'; }, 2500);
  };
  s.onerror = () => {
    btn.disabled = false;
    btn.textContent = '❌ 失败';
    status.textContent = '更新失败，请检查网络';
    setTimeout(() => { btn.textContent = '🔄 更新'; }, 2500);
  };
  document.head.appendChild(s);
}

/* ====== 启动 ====== */
init();
</script>
